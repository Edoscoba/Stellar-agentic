[package]
name = "solvency_proof"
version = "0.1.0"
edition = "2021"
description = "Off-chain Groth16 prover for PaymentChannel solvency proofs, verifiable on-chain via Soroban's native BLS12-381 host functions."

[lib]
name = "solvency_proof"
path = "src/lib.rs"

[[bin]]
name = "solvency-prover"
path = "src/bin/prover.rs"

[dependencies]
ark-ff = "0.5"
ark-ec = "0.5"
ark-bls12-381 = "0.5"
ark-groth16 = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-snark = "0.5"
ark-serialize = "0.5"
ark-std = { version = "0.5", features = ["std", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
payment_channel = { path = "../../contracts/payment_channel" }
